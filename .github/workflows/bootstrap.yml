name: Bootstrap repository content
on:
  push:
    paths:
      - 'repo-content.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack repository content
        run: |
          base64 -d repo-content.b64 > repo-content.zip
          unzip -o repo-content.zip -d .
      - name: Fetch vendored libheif-js 1.23.5 (integrity pinned)
        run: |
          curl -sSL --fail -o /tmp/libheif-js.tgz https://registry.npmjs.org/libheif-js/-/libheif-js-1.23.5.tgz
          HASH="sha512-$(openssl dgst -sha512 -binary /tmp/libheif-js.tgz | base64 -w0)"
          test "$HASH" = "sha512-umXZPthnWZtF3iG/5mQG+AZ2V6i0UeYpo3z2CkggTEgL8dKmIIwJT6TDuAMuabXa1yTW8uJ1ZAgR+CxNTklYYw=="
          tar xzf /tmp/libheif-js.tgz -C /tmp
          mkdir -p src/PhotoFixer/wwwroot/vendor
          cp /tmp/package/libheif-wasm/libheif-bundle.js src/PhotoFixer/wwwroot/vendor/libheif-bundle.js
          cp /tmp/package/libheif-wasm/LICENSE src/PhotoFixer/wwwroot/vendor/LIBHEIF-LICENSE.txt
          cp /tmp/package/LICENSE src/PhotoFixer/wwwroot/vendor/LIBHEIF-JS-LICENSE.txt
      - name: Commit and push
        run: |
          rm -f repo-content.b64 repo-content.zip .github/workflows/bootstrap.yml
          git config user.name "photofixer-deploy"
          git config user.email "photofixer-deploy@users.noreply.github.com"
          git add -A
          git commit -m "Update PhotoFixer: HEIC/AVIF/WebP/BMP/GIF input support, brand identifiers"
          git push
